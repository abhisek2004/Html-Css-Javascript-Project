
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <title>TempX | Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app">
        <header class="header">
            <div class="logo">✳</div>
            <span>TEMP<span class="accent">X</span></span>
            <span class="status">● ONLINE</span>
        </header>

        <section class="hero">
            <span class="eyebrow">SMART TEMPERATURE TOOL</span>
            <h1>Temperature<br><span>Converter.</span></h1>
            <p>Convert temperatures instantly with precision and simplicity.</p>
        </section>

        <section class="converter">
            <div class="input-group">
                <label for="input-value">ENTER TEMPERATURE</label>
                <input type="number" id="input-value"
                    placeholder="Enter a value..." step="any">
            </div>

            <div class="units">
                <div class="unit-box">
                    <label for="input">FROM</label>
                    <select id="input">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button class="swap-btn" id="swap" aria-label="Swap units">⇄</button>

                <div class="unit-box">
                    <label for="output">TO</label>
                    <select id="output">
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="celsius">Celsius (°C)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
            </div>

            <button class="convert-btn" id="convert">
                Convert Temperature <span>→</span>
            </button>

            <div class="result-box">
                <span class="result-label">CONVERSION RESULT</span>
                <div class="result-value" id="result">--</div>
                <p id="result-unit">Your result will appear here</p>
            </div>

            <button class="clear-btn" id="clear">↻ Reset Converter</button>
        </section>

        <footer>
            <p>Designed & Developed by <strong>Abhisek Panda</strong></p>
            <span>© 2026 TEMPX · Built with precision.</span>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
