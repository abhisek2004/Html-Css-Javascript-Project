
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070816">

    <title>NEXORA AI | Intelligence Beyond Limits</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070816;
            --purple: #a855f7;
            --blue: #38bdf8;
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
            background:
                radial-gradient(ellipse at 50% 50%,
                #17143c 0%, #0a0b20 45%, #070816 100%);
        }

        .grid {
            position: absolute;
            inset: -50%;
            background-image:
                linear-gradient(rgba(120,100,255,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120,100,255,.06) 1px, transparent 1px);
            background-size: 65px 65px;
            transform: perspective(500px) rotateX(60deg);
            mask-image: linear-gradient(transparent, black, transparent);
        }

        .light {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .2;
        }

        .light-one {
            background: #8b5cf6;
            top: -200px;
            left: -150px;
        }

        .light-two {
            background: #06b6d4;
            right: -150px;
            bottom: -200px;
        }

        /* PARTICLES */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 12px #a78bfa;
        }

        /* MAIN CONTENT */

        .main {
            width: 100%;
            max-width: 1000px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 17px;
            border: 1px solid rgba(167,139,250,.3);
            border-radius: 50px;
            background: rgba(139,92,246,.09);
            color: #c4b5fd;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        /* AI CORE */

        .core-wrapper {
            width: 290px;
            height: 290px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 15px;
        }

        .core {
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 43px;
            font-weight: 900;
            background: linear-gradient(135deg, #9333ea, #2563eb, #06b6d4);
            box-shadow:
                0 0 40px rgba(139,92,246,.6),
                inset 0 0 20px rgba(255,255,255,.3);
            position: relative;
            z-index: 3;
        }

        .core::before {
            content: "";
            position: absolute;
            inset: -7px;
            border: 1px solid rgba(167,139,250,.7);
            border-radius: 35px;
        }

        .core span {
            background: linear-gradient(white, #bfdbfe);
            color: transparent;
            background-clip: text;
        }

        .orbit {
            position: absolute;
            width: 230px;
            height: 230px;
            border: 1px solid rgba(139,92,246,.35);
            border-radius: 50%;
        }

        .orbit-two {
            width: 275px;
            height: 120px;
            border-color: rgba(56,189,248,.5);
            transform: rotate(-35deg);
        }

        .orbit-three {
            width: 275px;
            height: 120px;
            border-color: rgba(192,132,252,.4);
            transform: rotate(35deg);
        }

        .orbit-four {
            width: 190px;
            height: 190px;
            border-style: dashed;
            border-color: rgba(255,255,255,.2);
        }

        .orbit-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 18px #38bdf8;
        }

        .dot-one {
            top: 35px;
            right: 45px;
        }

        .dot-two {
            bottom: 42px;
            left: 32px;
            background: #c084fc;
            box-shadow: 0 0 18px #c084fc;
        }

        /* TEXT */

        .title {
            font-size: clamp(45px, 8vw, 85px);
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 1.1;
            margin-top: 15px;
        }

        .title span {
            background: linear-gradient(
                100deg,
                #c084fc,
                #818cf8,
                #38bdf8,
                #c084fc
            );
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradient 5s linear infinite;
        }

        @keyframes gradient {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            color: #a5a5c2;
            font-size: clamp(13px, 2vw, 17px);
            line-height: 1.8;
            margin-top: 20px;
            max-width: 550px;
        }

        /* BOTTOM TAGS */

        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 35px;
        }

        .feature {
            padding: 11px 17px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            background: rgba(255,255,255,.04);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 600;
            transition: .3s;
        }

        .feature:hover {
            border-color: #a78bfa;
            background: rgba(139,92,246,.12);
            transform: translateY(-4px);
        }

        /* FOOTER */

        .footer {
            margin-top: 55px;
            color: #656783;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .footer span {
            color: #c084fc;
            font-weight: 800;
        }

        /* RESPONSIVE */

        @media(max-width: 600px) {
            .core-wrapper {
                transform: scale(.82);
                margin-top: -15px;
                margin-bottom: -15px;
            }

            .title {
                letter-spacing: -2px;
            }

            .subtitle {
                padding: 0 12px;
            }

            .features {
                gap: 8px;
            }

            .feature {
                font-size: 10px;
                padding: 9px 12px;
            }

            .footer {
                margin-top: 35px;
            }
        }

        @media(prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="grid"></div>
        <div class="light light-one"></div>
        <div class="light light-two"></div>
    </div>

    <div class="particles" id="particles"></div>

    <main class="main">

        <div class="status">
            <span class="status-dot"></span>
            NEXT GENERATION TECHNOLOGY
        </div>

        <div class="core-wrapper">

            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>
            <div class="orbit orbit-four"></div>

            <div class="orbit-dot dot-one"></div>
            <div class="orbit-dot dot-two"></div>

            <div class="core">
                <span>AI</span>
            </div>

        </div>

        <h1 class="title">
            NEXORA<span> AI</span>
        </h1>

        <p class="subtitle">
            Intelligence Beyond Limits.
            Experience the next evolution of artificial intelligence,
            innovation and digital possibilities.
        </p>

        <div class="features">
            <div class="feature">✦ AI POWERED</div>
            <div class="feature">◈ SMART TECHNOLOGY</div>
            <div class="feature">⌘ FUTURE READY</div>
        </div>

        <div class="footer">
            CRAFTED WITH ❤️ BY <span>RD CREATIONS</span>
        </div>

    </main>

    <script>
        // Particle generation
        const particleContainer = document.getElementById("particles");

        for (let i = 0; i < 65; i++) {
            const particle = document.createElement("div");
            particle.className = "particle";

            particle.style.left = Math.random() * 100 + "%";
            particle.style.top = Math.random() * 100 + "%";
            particle.style.opacity = Math.random() * 0.8 + 0.2;

            particleContainer.appendChild(particle);

            gsap.to(particle, {
                y: -100 - Math.random() * 150,
                x: Math.random() * 80 - 40,
                opacity: 0,
                duration: 4 + Math.random() * 7,
                repeat: -1,
                delay: Math.random() * 5,
                ease: "sine.inOut"
            });
        }

        // Orbit animation
        gsap.to(".orbit-one", {
            rotation: 360,
            duration: 25,
            repeat: -1,
            ease: "none"
        });

        gsap.to(".orbit-two", {
            rotation: 325,
            duration: 18,
            repeat: -1,
            ease: "none"
        });

        gsap.to(".orbit-three", {
            rotation: 395,
            duration: 22,
            repeat: -1,
            ease: "none"
        });

        gsap.to(".orbit-four", {
            rotation: -360,
            duration: 35,
            repeat: -1,
            ease: "none"
        });

        // AI core floating effect
        gsap.to(".core", {
            y: -12,
            scale: 1.05,
            duration: 2.5,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });

        // Glowing core
        gsap.to(".core", {
            boxShadow: "0 0 75px rgba(56,189,248,.8)",
            duration: 2,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });

        // Background lights
        gsap.to(".light-one", {
            x: 120,
            y: 80,
            duration: 10,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });

        gsap.to(".light-two", {
            x: -100,
            y: -80,
            duration: 12,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });

        // Entrance animation
        gsap.from(".main > *", {
            opacity: 0,
            y: 35,
            duration: 1.2,
            stagger: 0.15,
            ease: "power3.out",
            delay: 0.2
        });
    </script>

</body>
</html>
