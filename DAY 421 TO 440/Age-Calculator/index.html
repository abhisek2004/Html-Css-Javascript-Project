<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="age-calculator">
        <div class="calculator-card">

            <h1>Age Calculator</h1>

            <p class="subtitle">
                Enter your date of birth to calculate your exact age.
            </p>

            <div class="input-group">
                <label for="dates">Date of Birth</label>
                <input 
                    type="date" 
                    id="dates"
                    name="dateOfBirth"
                    required
                >
            </div>

            <button type="button" onclick="get()">
                Calculate Age
            </button>

            <div id="result" class="result" aria-live="polite">
                <!-- Age result will appear here -->
            </div>

        </div>
    </main>

    <script src="index.js"></script>

</body>
</html>
This version gives you a better base for adding a **modern card UI, animated result, years/months/days calculation, and responsive mobile design**.
