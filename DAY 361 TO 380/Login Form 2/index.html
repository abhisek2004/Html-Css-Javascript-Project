
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login | RD Creations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #080b16;
            color: #fff;
        }

        /* Background Effects */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 8s infinite ease-in-out alternate;
        }

        .circle.one {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #6d28d9, #2563eb);
            top: -100px;
            left: -100px;
            opacity: 0.5;
        }

        .circle.two {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #0891b2, #4f46e5);
            bottom: -100px;
            right: -70px;
            opacity: 0.4;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(40px, 50px);
            }
        }

        /* Login Container */

        .login-container {
            width: 420px;
            max-width: calc(100% - 32px);
            padding: 45px 38px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            background: rgba(17, 24, 39, 0.82);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */

        .logo {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 20px;
            font-size: 26px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            box-shadow: 0 0 30px rgba(99,102,241,0.4);
        }

        .heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .heading h1 {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .heading h1 span {
            background: linear-gradient(90deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .heading p {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 10px;
        }

        /* Input Fields */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #d1d5db;
        }

        .input-field {
            display: flex;
            align-items: center;
            height: 54px;
            padding: 0 16px;
            border: 1px solid #374151;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            transition: 0.3s ease;
        }

        .input-field:focus-within {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129,140,248,0.12),
                        0 0 20px rgba(99,102,241,0.15);
        }

        .input-field i {
            color: #818cf8;
            font-size: 16px;
            margin-right: 13px;
        }

        .input-field input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
        }

        .input-field input::placeholder {
            color: #6b7280;
        }

        .toggle-password {
            cursor: pointer;
            color: #9ca3af !important;
            margin: 0 !important;
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #9ca3af;
        }

        .remember input {
            accent-color: #818cf8;
        }

        .options a,
        .signup a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        .options a:hover,
        .signup a:hover {
            color: #38bdf8;
        }

        /* Login Button */

        .login-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #7c3aed, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 8px 25px rgba(79,70,229,0.25);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(79,70,229,0.45);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Signup */

        .signup {
            text-align: center;
            margin-top: 27px;
            color: #9ca3af;
            font-size: 13px;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 25px 0 18px;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            font-size: 11px;
        }

        .footer span {
            color: #a78bfa;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 23px;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="circle one"></div>
        <div class="circle two"></div>
    </div>

    <div class="login-container">

        <div class="logo">
            <i class="fas fa-user-shield"></i>
        </div>

        <div class="heading">
            <h1>Welcome <span>Back!</span></h1>
            <p>Enter your details to access your account.</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>

                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <i class="fas fa-eye toggle-password"
                       id="togglePassword"
                       aria-label="Show password"
                       role="button"
                       tabindex="0"></i>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                LOGIN <i class="fas fa-arrow-right"></i>
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">Create Account</a>
        </div>

        <div class="divider"></div>

        <div class="footer">
            Designed with ❤️ by <span>RD Creations</span>
        </div>

    </div>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        function togglePasswordVisibility() {
            const isHidden = password.type === "password";

            password.type = isHidden ? "text" : "password";

            toggle.classList.toggle("fa-eye", !isHidden);
            toggle.classList.toggle("fa-eye-slash", isHidden);

            toggle.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        }

        toggle.addEventListener("click", togglePasswordVisibility);

        toggle.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                togglePasswordVisibility();
            }
        });

        document.getElementById("loginForm").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("Login UI is ready! Connect your authentication backend.");
        });
    </script>

</body>
</html>
